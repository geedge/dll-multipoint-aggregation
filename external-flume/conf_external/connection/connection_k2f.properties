#为source channel  sink起名
connection.channels = c1
connection.sinks = k1
#指定channel为kafka channel,省略source使得效率更高
connection.channels.c1.type = org.apache.flume.channel.kafka.KafkaChannel
connection.channels.c1.kafka.bootstrap.servers = 192.168.40.152:9092
connection.channels.c1.kafka.topic = CONNECTION-RECORD-LOG
connection.channels.c1.kafka.consumer.group.id = lxk_0514
connection.channels.c1.kafka.consumer.auto.offset.reset = latest
connection.channels.c1.kafka.consumer.enable.auto.commit = true
connection.channels.c1.kafka.consumer.fetch.max.wait.ms = 1000
connection.channels.c1.kafka.consumer.fetch.min.bytes = 1048576
connection.channels.c1.parseAsFlumeEvent = false

#原始file roll sink，将数据写到本机磁盘
connection.sinks.k1.type = file_roll
connection.sinks.k1.channel = c1
connection.sinks.k1.sink.pathManager = default
connection.sinks.k1.sink.pathManager.extension = dat
connection.sinks.k1.sink.pathManager.prefix = test-
connection.sinks.k1.sink.rollInterval = 30
connection.sinks.k1.sink.directory = /home/192.168.60.101/CONNECTION-RECORD-LOG
