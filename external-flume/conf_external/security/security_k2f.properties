#为source channel  sink起名
security.channels = c1
security.sinks = k1
#指定channel为kafka channel,省略source使得效率更高
security.channels.c1.type = org.apache.flume.channel.kafka.KafkaChannel
security.channels.c1.kafka.bootstrap.servers = 192.168.40.152:9092
security.channels.c1.kafka.topic = SECURITY-EVENT-LOG
security.channels.c1.kafka.consumer.group.id = lxk_0514
security.channels.c1.kafka.consumer.auto.offset.reset = latest
security.channels.c1.kafka.consumer.enable.auto.commit = true
security.channels.c1.kafka.consumer.fetch.max.wait.ms = 1000
security.channels.c1.kafka.consumer.fetch.min.bytes = 1048576
security.channels.c1.parseAsFlumeEvent = false

#原始file roll sink，将数据写到本机磁盘
security.sinks.k1.type = file_roll
security.sinks.k1.channel = c1
security.sinks.k1.sink.pathManager = default
security.sinks.k1.sink.pathManager.extension = dat
security.sinks.k1.sink.pathManager.prefix = test-
security.sinks.k1.sink.rollInterval = 30
security.sinks.k1.sink.directory = /home/192.168.60.101/SECURITY-EVENT-LOG
