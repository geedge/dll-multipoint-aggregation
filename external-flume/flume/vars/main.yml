#注意这里面定义的key中不能包含减号-,否则程序无法识别定义的key

#########################从docker仓库pull镜像的相关属性##########################################################
#docker仓库(harbor)中的地址,镜像名称和tag
docker_registry_image_and_tag: 192.168.40.153:9080/tsg/flume:1.9.0 #bifang_api镜像和tag名称

#########################离线加载docker镜像的相关属性##########################################################
#离线模式下使用:bifang-api的docker镜像文件名称,在../file中的文件名称
image_tar_name: flume-1.9.0.tar



##########################公共属性#############################
#设置容器的hostname
#container_hostname: bifang-api
#{{ image_tar_name }}中的镜像名称,或者{{ docker_registry_image_and_tag }}中的镜像名称,不含版本号
image_name: flume
#{{ image_tar_name }}的镜像版本号,或者{{ docker_registry_image_and_tag }}中的镜像版本号
image_tag_name: 1.9.0
#{{ image_tar_name }}的镜像,或者{{ docker_registry_image_and_tag }}中的镜像启动后的容器名称
image_container_name: flume
#镜像文件,docker-compose文件以及数据卷共享目录所在的位置,注意路径最后面不带/
soft_home_path: /home/test/flume
dll_volume_path: {ACTIVE-DEFENCE-EVENT-COMPLETED-LOG,CONNECTION-RECORD-COMPLETED-LOG,PROXY-EVENT-COMPLETED-LOG,SECURITY-EVENT-COMPLETED-LOG,TRAFFIC-METRICS-LOG}

