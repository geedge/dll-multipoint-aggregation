active_denfence.sources = s2
active_denfence.channels = c2
#指定source收集到的数据发送到哪个管道
active_denfence.sources.s2.channels = c2
#taildir source
active_denfence.sources.s2.type = TAILDIR
active_denfence.sources.s2.channels = c2
#需要映射到宿主机做持久化
active_denfence.sources.s2.positionFile = /home/test/3active_denfence_position.json
#需要分组13台主机的数据
active_denfence.sources.s2.filegroups = f1 f2 f3 f4 f5 f6 f7 f8 f9 f10 f11 f12 f13
#需要分组按照序号 [0-9] 目前最多支持10个进程，可以增加
active_denfence.sources.s2.filegroups.f1 = /home/data/192.168.60.101/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f2 = /home/data/192.168.60.102/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f3 = /home/data/192.168.60.103/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f4 = /home/data/192.168.60.104/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f5 = /home/data/192.168.60.105/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f6 = /home/data/192.168.60.106/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f7 = /home/data/192.168.60.107/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f8 = /home/data/192.168.60.108/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f9 = /home/data/192.168.60.109/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f10 = /home/data/192.168.60.110/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f11 = /home/data/192.168.60.111/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f12 = /home/data/192.168.60.112/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat
active_denfence.sources.s2.filegroups.f13 = /home/data/192.168.60.113/ACTIVE-DEFENCE-EVENT-LOG/.*[4-5].dat


active_denfence.sources.s2.maxBatchCount = 10000

# kafka channel充当生产者
active_denfence.channels.c2.type = org.apache.flume.channel.kafka.KafkaChannel
active_denfence.channels.c2.brokerList = 192.168.1.3:9093
active_denfence.channels.c2.topic = ACTIVE-DEFENCE-EVENT-LOG
#false表示是以纯文本的形式写进入的，true是以event的形式写进入的，以event写进入时，会出现乱码， 默认是true
active_denfence.channels.c2.parseAsFlumeEvent = false
active_denfence.channels.c2.kafka.producer.acks = 1
active_denfence.channels.c2.producer.type=sync
active_denfence.channels.c2.queue.buffering.max.ms = 5000
active_denfence.channels.c2.queue.buffering.max.messages=20000
active_denfence.channels.c2.batch.num.messages=5000
